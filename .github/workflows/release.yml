name: Release Windows build

# Releases are cut by committing a new version to release.txt on main (the session proxy cannot push tags);
# pushing a v* tag directly also works.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["release.txt"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TPL: 4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (no LFS yet)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Release version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$(head -n1 release.txt | tr -d '[:space:]')"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: LFS object list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: Pull LFS
        run: git lfs pull

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/$GODOT_TPL
          B=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION
          curl -sSLf -o /tmp/godot.zip $B/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          curl -sSLf -o /tmp/tpl.tpz $B/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/$GODOT_TPL/

      # Cache only the FBX files: caching the folder would also restore stale *.import settings over the
      # committed ones (that shipped an untextured player in v0.1.0).
      - name: Cache Mixamo sources
        uses: actions/cache@v4
        with:
          path: assets/source/mixamo/**/*.fbx
          key: mixamo-fbx-${{ hashFiles('assets/mixamo_manifest.json') }}
          restore-keys: mixamo-fbx-

      - name: Fetch Mixamo sources (owner's shared Drive link; never committed)
        run: python3 tools/fetch_mixamo.py

      - name: Import project
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          chmod +x $GODOT
          $GODOT --headless --import --path . || true
          $GODOT --headless --import --path .

      - name: Asset check (fails the build if anything is missing or untextured)
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          $GODOT --headless --path . res://tests/runner.tscn -- res://tests/asset_check.gd 2>&1 | tee asset_check.log
          grep -q "ASSET CHECK: PASS" asset_check.log

      - name: Export Windows build
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
          mkdir -p build/PortSolano
          $GODOT --headless --path . --export-release "Windows Desktop" build/PortSolano/PortSolano.exe
          ls -la build/PortSolano
          test -s build/PortSolano/PortSolano.exe
          test -s build/PortSolano/PortSolano.pck
          cp OWNER_TEST_CHECKLIST.md build/PortSolano/ || true
          cd build && zip -r -q PortSolano-${{ steps.ver.outputs.tag }}-windows-x86_64.zip PortSolano

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Port Solano ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
          files: build/PortSolano-*.zip

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PortSolano-windows
          path: build/PortSolano-*.zip
